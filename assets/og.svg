    <path d="M1036 38c32-6 66 10 70 48 4 34-22 60-58 62-34 2-60-22-62-54-2-30 22-56 56-58 14-1 26 4 34 12" fill="none" stroke="#C8322B" stroke-width="4" stroke-linecap="round"/>
    <text x="1046" y="114" text-anchor="middle" class="pen" font-size="64" fill="#C8322B">36</text>
  </g>

  <!-- the sentence -->
  <text x="96" y="310" class="book" font-size="84" fill="#161616">Hello I am a good designer</text>

  <!-- "good": struck through, not said -->
  <path d="M524 288c40-4 98-7 188-5" fill="none" stroke="#C8322B" stroke-width="5" stroke-linecap="round"/>
  <text x="618" y="212" text-anchor="middle" class="pen" font-size="40" fill="#C8322B" transform="rotate(-4 618 212)">not said</text>
  <path d="M606 222c-4 12-6 22-4 32" fill="none" stroke="#C8322B" stroke-width="3" stroke-linecap="round"/>
  <path d="M594 246l8 10 8-9" fill="none" stroke="#C8322B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

