  <!-- Social sharing image for openpronounce.github.io. Regenerate the PNG with scripts/og.sh.
       Fonts follow assets/site.css, with the closest local fallbacks named after them. -->
  <style>
    .book { font-family: "Charis SIL", "Gentium Book Basic", "Gentium Book Plus", Georgia, serif; }
    .ipa  { font-family: "Charis SIL", "Gentium", "Gentium Plus", "Doulos SIL", Georgia, serif; font-style: italic; }
    .pen  { font-family: "Caveat", "xkcd Script", "Segoe Print", "Bradley Hand", cursive; }
    .sans { font-family: "IBM Plex Sans", "Inter", "Helvetica Neue", Arial, sans-serif; }
  </style>
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <!-- exercise sheet margin -->
  <line x1="64" y1="0" x2="64" y2="630" stroke="#C8322B" stroke-opacity="0.28" stroke-width="2"/>

  <!-- wordmark: logo from assets/favicon.svg, scaled x2.5 -->
  <g transform="translate(96 54) scale(2.5)">
    <rect width="24" height="24" rx="4" fill="#161616"/>
    <path d="M5 14.5c1.6-2.4 3.2-2.4 4.7 0s3.1 2.4 4.6 0 3.1-2.4 4.7 0" stroke="#E0453D" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </g>
  <text x="172" y="98" class="sans" font-size="40" font-weight="600" fill="#161616">OpenPronounce</text>

  <!-- overall score, circled as in the home demo -->
